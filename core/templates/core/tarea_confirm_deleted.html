{% extends 'core/base.html' %}
{% block titulo %}Eliminar Tarea{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Eliminar Tarea</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">¿Estás seguro de que deseas eliminar la tarea <strong>"{{ object.titulo }}"</strong>?</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="button" onclick="history.back()" class="btn btn-secondary me-2">Cancelar</button>
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
